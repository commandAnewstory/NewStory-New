name: newstory
description: "뉴스를 거부감 없게, 재밌고 가볍게 볼 수 있는 앱."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  flutter_riverpod: ^2.6.1

  # 라우팅
  go_router: ^14.6.3

  # 네트워크
  dio: ^5.7.0

  # 보안 저장소 (JWT)
  flutter_secure_storage: ^9.2.2

  # 폰트
  google_fonts: ^6.2.1

  # 소셜 로그인
  kakao_flutter_sdk_user: ^1.9.4
  google_sign_in: ^6.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
