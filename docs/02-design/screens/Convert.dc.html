<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; }
    .display { font-family: 'Do Hyeon', -apple-system, sans-serif; font-weight: 400; letter-spacing: -0.01em; }
  </style>
</helmet>
<div style="width:390px; height:844px; background:#F7F7F6; position:relative; overflow:hidden; border:1px solid #ddd;">
  <div style="display:flex; flex-direction:column; height:100%;">

    <div style="padding:20px 20px 4px;">
      <span class="display" style="font-size:21px; color:#17181C;">직접 변환</span>
      <div style="font-size:13px; color:#9A9CA3; margin-top:4px;">뉴스 링크를 붙여넣으면 원하는 스타일로 바꿔드려요</div>
    </div>

    <div style="flex:1; overflow-y:auto; padding:20px 20px 40px;">

      <div style="display:flex; align-items:center; gap:8px; background:#fff; border:1.6px solid #E7E4DE; border-radius:14px; padding:14px 16px; margin-bottom:14px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9A9CA3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>
        <span style="font-size:13px; color:#9CA0A8;">https:// 뉴스 기사 링크 붙여넣기</span>
      </div>

      <div style="font-size:12px; color:#9A9CA3; margin-bottom:10px;">지원 언론사</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px;">
        <sc-for list="{{sources}}" as="s" hint-placeholder-count="6">
          <div style="padding:7px 13px; border-radius:14px; background:#fff; border:1.2px solid #ECEAE4; font-size:12px; color:#4A4D55; font-weight:500;">{{s.name}}</div>
        </sc-for>
      </div>

      <div style="font-size:13px; font-weight:700; color:#17181C; margin-bottom:12px;">어떤 스타일로 볼까요</div>
      <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:24px;">

        <div style="display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px; background:#fff; border:2px solid #3654F4;">
          <div style="width:42px; height:42px; border-radius:12px; background:#FDECC8; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A5A0F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c3-2 6-1 8 0v13c-2-1-5-2-8 0V6Z"/><path d="M20 6c-3-2-6-1-8 0v13c2-1 5-2 8 0V6Z"/></svg>
          </div>
          <div style="flex:1;">
            <div style="font-size:14px; font-weight:700; color:#17181C;">동화체</div>
            <div style="font-size:12px; color:#9A9CA3; margin-top:2px;">쉽고 친근하게, 아이도 이해할 수 있게</div>
          </div>
          <div style="width:20px; height:20px; border-radius:50%; background:#3654F4; display:flex; align-items:center; justify-content:center;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px; background:#fff; border:1.4px solid #ECEAE4;">
          <div style="width:42px; height:42px; border-radius:12px; background:#E6DEFA; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A3A9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 18 6"/><path d="M14 4l4 4-2 2-4-4z"/></svg>
          </div>
          <div style="flex:1;">
            <div style="font-size:14px; font-weight:700; color:#17181C;">소설체</div>
            <div style="font-size:12px; color:#9A9CA3; margin-top:2px;">이야기처럼 몰입감 있게</div>
          </div>
          <div style="width:20px; height:20px; border-radius:50%; border:1.6px solid #D8D4CC;"></div>
        </div>

        <div style="display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px; background:#fff; border:1.4px solid #ECEAE4;">
          <div style="width:42px; height:42px; border-radius:12px; background:#D7F3EE; flex-shrink:0; display:flex; align-items:center; justify-content:center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B6E64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="12" height="14" rx="2"/><path d="M9 3h12v14"/></svg>
          </div>
          <div style="flex:1;">
            <div style="font-size:14px; font-weight:700; color:#17181C;">카드요약</div>
            <div style="font-size:12px; color:#9A9CA3; margin-top:2px;">핵심만 30초 컷으로</div>
          </div>
          <div style="width:20px; height:20px; border-radius:50%; border:1.6px solid #D8D4CC;"></div>
        </div>
      </div>

      <div style="height:52px; border-radius:14px; background:#3654F4; display:flex; align-items:center; justify-content:center;">
        <span class="display" style="font-size:15px; color:#fff;">변환 시작하기</span>
      </div>
      <div style="font-size:11px; color:#9CA0A8; text-align:center; margin-top:12px;">유튜브·SNS·페이월 기사는 지원하지 않아요</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      sources: [{name:'네이버뉴스'},{name:'조선일보'},{name:'중앙일보'},{name:'동아일보'},{name:'SBS'},{name:'MBC'}],
    };
  }
}
</script>
</body>
</html>
