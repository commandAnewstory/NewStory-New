<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; }
    a { color: #3654F4; } a:hover { color: #2440D6; }
    .display { font-family: 'Do Hyeon', -apple-system, sans-serif; font-weight: 400; letter-spacing: -0.01em; }
  </style>
</helmet>
<div style="width:390px; height:844px; background:#fff; position:relative; overflow:hidden; border:1px solid #ddd;">
  <div style="display:flex; flex-direction:column; height:100%;">

    <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
      <div style="display:flex; gap:16px; color:#6B6E76;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><path d="M8.2 10.8 15.8 6.4M8.2 13.2l7.6 4.4"/></svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4V4Z"/></svg>
      </div>
    </div>

    <div style="display:flex; gap:6px; padding:6px 16px 16px;">
      <div style="padding:7px 14px; border-radius:16px; font-size:12px; color:#9A9CA3; border:1.3px solid #ECEAE4;">원문</div>
      <div class="display" style="padding:7px 14px; border-radius:16px; font-size:13px; color:#fff; background:#3654F4;">동화체</div>
      <div style="padding:7px 14px; border-radius:16px; font-size:12px; color:#9A9CA3; border:1.3px solid #ECEAE4;">소설체</div>
      <div style="padding:7px 14px; border-radius:16px; font-size:12px; color:#9A9CA3; border:1.3px solid #ECEAE4;">카드요약</div>
    </div>

    <div style="flex:1; overflow-y:auto; padding:2px 20px 110px;">
      <div style="font-size:11px; color:#9A9CA3; margin-bottom:8px;">연합뉴스 · 12분 전</div>
      <div style="height:15px; width:100%; background:#EDEBE5; border-radius:4px; margin-bottom:8px;"></div>
      <div style="height:15px; width:72%; background:#EDEBE5; border-radius:4px; margin-bottom:20px;"></div>

      <div style="height:180px; border-radius:14px; background:repeating-linear-gradient(135deg,#F0F0EC,#F0F0EC 8px,#F7F7F4 8px,#F7F7F4 16px); border:1px solid #E7E4DE; margin-bottom:20px;"></div>

      <div style="font-size:15px; line-height:1.9; color:#33353B;">
        옛날 옛날, 어느 마을에 <span style="border-bottom:2px dotted #3654F4; color:#3654F4; font-weight:600; position:relative;">기준금리</span>라는 신기한 저울이 있었어요.
        이 저울이 조금만 움직여도 마을 사람들의 지갑 사정이 크게 달라졌지요.
        <span style="background:#3654F4; color:#fff; border-radius:10px 10px 10px 2px; padding:14px 16px; display:inline-block; margin:10px 0; font-size:13px; line-height:1.6; font-weight:500; box-shadow:0 8px 20px rgba(54,84,244,0.25);">
          <b style="display:block; margin-bottom:4px; font-size:11px; opacity:0.85;">기준금리란?</b>
          한 나라의 중앙은행이 돈을 빌려줄 때 기준으로 삼는 이자율이에요. 이 숫자가 오르면 대출 이자도 함께 올라요.
        </span>
        저울지기 아저씨는 고민 끝에 <span style="border-bottom:2px dotted #3654F4; color:#3654F4; font-weight:600;">구조조정</span>을 결심했고, 마을에는 작은 소동이 벌어졌답니다.
      </div>
      <div style="height:14px; width:90%; background:#F1EFEA; border-radius:4px; margin-top:16px;"></div>
      <div style="height:14px; width:60%; background:#F1EFEA; border-radius:4px; margin-top:10px;"></div>
    </div>

    <div style="position:absolute; bottom:0; left:0; right:0; padding:14px 20px 22px; background:#fff; border-top:1px solid #ECEAE4; display:flex; gap:10px;">
      <div style="flex:1; height:50px; border-radius:14px; background:#3654F4; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4V4Z"/></svg>
        <span style="font-size:14px; font-weight:700; color:#fff;">보관함에 저장</span>
      </div>
      <div style="width:50px; height:50px; border-radius:14px; border:1.4px solid #ECEAE4; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17181C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><path d="M8.2 10.8 15.8 6.4M8.2 13.2l7.6 4.4"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
