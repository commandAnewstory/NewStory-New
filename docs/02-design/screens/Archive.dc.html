<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; }
    .display { font-family: 'Do Hyeon', -apple-system, sans-serif; font-weight: 400; letter-spacing: -0.01em; }
  </style>
</helmet>
<div style="width:390px; height:844px; background:#F7F7F6; position:relative; overflow:hidden; border:1px solid #ddd;">
  <div style="display:flex; flex-direction:column; height:100%;">

    <div style="padding:20px 20px 14px;">
      <span class="display" style="font-size:21px; color:#17181C;">보관함</span>
    </div>

    <div style="display:flex; gap:4px; padding:0 20px 16px;">
      <div style="flex:1; text-align:center; padding:10px 0; border-radius:12px; background:#17181C; font-size:13px; font-weight:700; color:#fff;">보관함</div>
      <div style="flex:1; text-align:center; padding:10px 0; border-radius:12px; font-size:13px; color:#9A9CA3;">히스토리</div>
    </div>

    <div style="flex:1; overflow-y:auto; padding:4px 20px 100px;">
      <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px;">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
          <div style="background:#fff; border-radius:14px; border:1px solid #ECEAE4; overflow:hidden;">
            <div style="height:88px; background:repeating-linear-gradient(135deg,#F0F0EC,#F0F0EC 8px,#F7F7F4 8px,#F7F7F4 16px); position:relative;">
              <span style="position:absolute; top:7px; left:7px; font-size:10px; font-weight:700; color:{{it.tagColor}}; background:{{it.tagBg}}; border-radius:6px; padding:3px 7px;">{{it.tag}}</span>
            </div>
            <div style="padding:10px;">
              <div style="height:9px; width:90%; background:#EDEBE5; border-radius:3px; margin-bottom:7px;"></div>
              <div style="height:9px; width:60%; background:#EDEBE5; border-radius:3px; margin-bottom:9px;"></div>
              <span style="font-size:10px; color:#9CA0A8;">{{it.date}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="position:absolute; bottom:0; left:0; right:0; height:66px; background:#fff; border-top:1px solid #ECEAE4; display:flex; align-items:center; justify-content:space-around;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA0A8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA0A8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11m0 0-3.5-3.5M18 7l-3.5 3.5"/><path d="M17 17H6m0 0 3.5-3.5M6 17l3.5 3.5"/></svg>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3654F4" stroke-width="1.8" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4V4Z"/></svg>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA0A8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { tag:'동화체', tagColor:'#8A5A0F', tagBg:'#FDECC8', date:'9월 1일' },
        { tag:'카드요약', tagColor:'#0B6E64', tagBg:'#D7F3EE', date:'8월 30일' },
        { tag:'소설체', tagColor:'#5A3A9E', tagBg:'#E6DEFA', date:'8월 29일' },
        { tag:'카드요약', tagColor:'#0B6E64', tagBg:'#D7F3EE', date:'8월 27일' },
        { tag:'동화체', tagColor:'#8A5A0F', tagBg:'#FDECC8', date:'8월 25일' },
        { tag:'소설체', tagColor:'#5A3A9E', tagBg:'#E6DEFA', date:'8월 22일' },
      ],
    };
  }
}
</script>
</body>
</html>
