<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; }
    .display { font-family: 'Do Hyeon', -apple-system, sans-serif; font-weight: 400; letter-spacing: -0.01em; }
  </style>
</helmet>
<div style="width:390px; height:844px; background:#F7F7F6; position:relative; overflow:hidden; border:1px solid #ddd;">
  <div style="display:flex; flex-direction:column; height:100%;">

    <div style="padding:20px 20px 16px;">
      <span class="display" style="font-size:21px; color:#17181C;">MY</span>
    </div>

    <div style="flex:1; overflow-y:auto; padding:0 20px 100px;">

      <div style="display:flex; align-items:center; gap:14px; background:#fff; border-radius:16px; padding:16px; margin-bottom:20px; border:1px solid #ECEAE4;">
        <div style="width:52px; height:52px; border-radius:50%; background:#E8ECFC; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#3654F4;">한</div>
        <div style="flex:1;">
          <div style="font-size:14px; font-weight:700; color:#17181C;">한예준</div>
          <div style="font-size:12px; color:#9A9CA3; margin-top:2px;">hyj090915@gmail.com</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA0A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>

      <div style="background:#fff; border-radius:16px; padding:18px; margin-bottom:20px; border:1.6px solid #3654F4;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3654F4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
            <span class="display" style="font-size:15px; color:#17181C;">오늘의 카드요약 위젯</span>
          </div>
          <div style="width:44px; height:26px; border-radius:13px; background:#3654F4; position:relative;">
            <div style="width:20px; height:20px; border-radius:50%; background:#fff; position:absolute; top:3px; right:3px;"></div>
          </div>
        </div>
        <div style="font-size:12px; color:#9A9CA3; line-height:1.5;">홈 화면에서 앱을 열지 않고도 오늘의 카드요약 3개를 바로 볼 수 있어요</div>
      </div>

      <div style="background:#fff; border-radius:16px; border:1px solid #ECEAE4; overflow:hidden;">
        <sc-for list="{{menu}}" as="m" hint-placeholder-count="5">
          <div style="display:flex; align-items:center; justify-content:between; padding:16px; border-bottom:1px solid #F2F0EA;">
            <span style="font-size:13px; color:#33353B; flex:1;">{{m.label}}</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D8D4CC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </sc-for>
        <div style="padding:16px;">
          <span style="font-size:13px; color:#E0523F;">로그아웃</span>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute; bottom:0; left:0; right:0; height:66px; background:#fff; border-top:1px solid #ECEAE4; display:flex; align-items:center; justify-content:space-around;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA0A8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA0A8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11m0 0-3.5-3.5M18 7l-3.5 3.5"/><path d="M17 17H6m0 0 3.5-3.5M6 17l3.5 3.5"/></svg>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9CA0A8" stroke-width="1.7" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4V4Z"/></svg>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3654F4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      menu: [
        { label: '계정 정보' },
        { label: '알림 설정' },
        { label: '언어' },
        { label: '문의하기' },
        { label: '이용약관' },
      ],
    };
  }
}
</script>
</body>
</html>
