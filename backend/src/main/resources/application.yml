spring:
  application:
    name: newstorybackend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newstory}
    username: ${SPRING_DATASOURCE_USERNAME:han-yejun}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:local-dev-secret-min-32-chars-here}
  access-expiration: 3600000
  refresh-expiration: 604800000

claude:
  api-key: ${CLAUDE_API_KEY:}

gemma:
  api-url: ${GEMMA_API_URL:http://localhost:8081/convert}

google:
  client-id:
    android: ${GOOGLE_CLIENT_ID_ANDROID:}
    ios: ${GOOGLE_CLIENT_ID_IOS:}
    web: ${GOOGLE_CLIENT_ID_WEB:}
